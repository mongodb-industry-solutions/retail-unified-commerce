---
# Drone object kind. Other types of objects are `secret` and `signature`.
kind: pipeline
# Execute this pipeline inside a Kubernetes pod.
# see https://docs.drone.io/pipeline/kubernetes/overview/
type: kubernetes
# Name for this pipeline. Multiple pipelines can be defined for your project
name: staging

# Target specific host architecture types.  arm64 is recommended.  
platform:
  arch: amd64 # 'arm64' is also an option

# trigger this pipeline only when the Github webhook is for an event on the
# main branch
trigger:
  branch:
    - staging

# List of pipeline steps.
steps:
  # `name` is any string, in this case we are building and publishing a Docker image.
  - name: publish-backend
    # Drone plugin to use for this step. The kaniko-ecr plugin is a docker image that builds
    # and publishes container images to the AWS Elastic Container Registry (ECR).
    # see https://github.com/drone/drone-kaniko
    image: plugins/kaniko-ecr
    # Configuration for the drone-ecr plugin.
    settings:
      # ECR repositories need to be created before they can be used.
      # This setting ensures they are created.
      create_repository: true
      # Hostname for the registry where this repository is hosted.
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com ## keep same for all demos
      # Repository path. This will be used to tag the resulting images.
      # The last section is a Drone variable and refers to the name of this Git repository.
      # AWS ECR does not accept uppercase letters in the repository name, to convert
      # to lowercase use ${DRONE_REPO_NAME,,}
      repo: industrysolutions/retail-unified-commerce-backend
      # Docker image tags that will be applied to the resulting image.
      # They will be prefixed with the repository name.
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: backend/advanced-search-ms/Dockerfile
      # Set build context to the backend service directory
      context: backend/advanced-search-ms
      # Plug-in variables for AWS IAM credentials to push to ECR. These are stored as
      # Drone secrets for each Git repo.
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    # This step will only run when the event is a push to the staging branch.
    when:
      event:
        - push

  - name: publish-frontend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/retail-unified-commerce-frontend
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: frontend/Dockerfile
      # Set build context to the frontend directory
      context: frontend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
      build_args:
        - NEXT_PUBLIC_ENABLE_VECTOR_SEARCH=true
        - NEXT_PUBLIC_ENABLE_HYBRID_SEARCH=true
        - NEXT_PUBLIC_ENABLE_ATLAS_SEARCH=true
        - NEXT_PUBLIC_ENABLE_FULLTEXT_SEARCH=true
    when:
      event:
        - push

  - name: deploy-combined-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: retail-unified-commerce-staging
      
      # Use combined deployment configuration
      values_files: ["environment/staging-combined.yaml"]
      
      # Override values dynamically from pipeline
      values:
        # CRITICAL: Override sidecar backend image with newly built version
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-unified-commerce-backend:git-${DRONE_COMMIT_SHA:0:7}"
        
        # Set frontend image (main container)
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-unified-commerce-frontend"
        
        # Ingress configuration (external access to frontend only)
        - "ingress.enabled=true"
        - "ingress.hosts[0]=retail-unified-commerce.industrysolutions.staging.corp.mongodb.com"
        
        # Enable service mesh
        - "mesh.enabled=true"
        
        # Resource limits (for entire pod - both containers share these)
        - "resources.limits.cpu=1000m"
        - "resources.limits.memory=1024Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=256Mi"
      
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
    when:
      event:
        - push

 # EA SERVER DEPLOYMENT - Same code, different database (Enterprise Server)
  - name: deploy-ea-server-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: retail-ea-server-staging

      # Use EA Server environment configuration
      values_files: ["environment/staging-ea-server-combined.yaml"]

      # Override values dynamically from pipeline
      values:
        # CRITICAL: Override sidecar backend image with newly built version
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-unified-commerce-backend:git-${DRONE_COMMIT_SHA:0:7}"

        # Set frontend image (main container) - SAME images as Atlas deployment
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-unified-commerce-frontend"

        # Ingress configuration - EA Server URL
        - "ingress.enabled=true"
        - "ingress.hosts[0]=retail-ea-server.industrysolutions.staging.corp.mongodb.com"

        # Enable service mesh
        - "mesh.enabled=true"

        # Resource limits (for entire pod - both containers share these)
        - "resources.limits.cpu=1000m"
        - "resources.limits.memory=1024Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=256Mi"

      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
    when:
      event:
        - push

