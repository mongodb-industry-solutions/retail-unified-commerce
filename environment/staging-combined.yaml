env:
  NODE_ENV: staging
  
  NEXT_PUBLIC_BACKEND_ENDPOINT: http://127.0.0.1:8000

envSecrets:
  # MongoDB Connection (frontend needs this for direct DB access)
  MONGODB_URI: retail-unified-commerce-staging
  DB_NAME: retail-unified-commerce-staging

sidecarContainers:
  - name: backend
    # Image will be overridden by Drone pipeline with specific git-SHA tag
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-unified-commerce-backend:latest
    
    # Expose backend port (accessible via localhost from frontend)
    ports:
      - containerPort: 8000
        name: backend
    
    # Environment variables for backend container
    env:
      - name: NODE_ENV
        value: staging
      
      # MongoDB Configuration (from secrets)
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: MONGODB_URI
      
      - name: MONGODB_DATABASE
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: MONGODB_DATABASE
      
      - name: PRODUCTS_COLLECTION
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: PRODUCTS_COLLECTION
      
      - name: SEARCH_TEXT_INDEX
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: SEARCH_TEXT_INDEX
      
      - name: SEARCH_VECTOR_INDEX
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: SEARCH_VECTOR_INDEX
      
      - name: EMBEDDING_FIELD_NAME
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: EMBEDDING_FIELD_NAME
      
      # Voyage AI Configuration (from secrets)
      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: VOYAGE_API_KEY
      
      - name: VOYAGE_API_URL
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: VOYAGE_API_URL
      
      - name: VOYAGE_MODEL
        valueFrom:
          secretKeyRef:
            name: retail-unified-commerce-staging
            key: VOYAGE_MODEL

serviceAccount:
  enabled: false

